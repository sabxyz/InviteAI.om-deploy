<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>InviteAI.om — دعوات رقمية أنيقة لكل مناسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Cairo',sans-serif; background:#F5F3EC; color:#2B2B22; }

  .hero { text-align:center; padding: 70px 24px 40px; }
  .hero .eyebrow { font-size:.78rem; letter-spacing:.25em; color:#6E7B52; font-weight:700; }
  .hero h1 { font-family:'Reem Kufi',sans-serif; font-weight:700; font-size:2.2rem; margin-top:14px; color:#3F4A2E; }

  .links { max-width: 460px; margin: 20px auto 60px; padding: 0 20px; display:flex; flex-direction:column; gap:14px; }
  .link-card {
    display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px;
    padding: 18px 20px; text-decoration:none; color:#2B2B22;

  }
  .link-card:hover { transform: translateY(-2px); }
  .link-card .emoji { font-size:1.6rem; }
  .link-card .txt strong { display:block; font-size:.95rem; }
  .link-card .txt span { font-size:.8rem; color:#8a8a78; }

  footer { text-align:center; padding: 30px; font-size:.78rem; color:#9a9a86; }

<body>

<div class="hero">

</div>

<div class="links">
  <a class="link-card" href="./themes.html">
    <span class="emoji">🎨</span>
    <span class="txt"><strong>الثيمات السبعة</strong><span>تصفح التصاميم واختار المناسب لمناسبتك</span></span>
  </a>
  <a class="link-card" href="./pricing.html">
    <span class="emoji">💰</span>
    <span class="txt"><strong>الباقات والأسعار</strong><span>أساسية، مميزة، فاخرة، ومخصصة</span></span>
  </a>
  <a class="link-card" href="./compare.html">
    <span class="emoji">🔍</span>
    <span class="txt"><strong>قارن بين الباقات</strong><span>شوف الفرق الحي بنفسك</span></span>
  </a>
</div>

<footer>@InviteAI.om — عُمان</footer>

</body>
</html>
